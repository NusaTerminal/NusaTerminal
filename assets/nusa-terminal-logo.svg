<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Nusa Terminal Logo</title>
  <desc id="desc">A modern terminal-inspired NT monogram for Nusa Terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1F35"/>
    </linearGradient>
    <linearGradient id="accent" x1="118" y1="126" x2="390" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35E2C2"/>
      <stop offset="1" stop-color="#4DA3FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#accent)" stroke-width="6" opacity=".38"/>

  <g filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- N monogram -->
    <path d="M132 340V172L246 340V172"/>
    <!-- Terminal prompt -->
    <path d="M296 190L374 256L296 322"/>
    <path d="M326 354H390"/>
  </g>

  <circle cx="406" cy="118" r="9" fill="#35E2C2"/>
  <circle cx="436" cy="118" r="9" fill="#4DA3FF" opacity=".8"/>
</svg>